name: Sync Roadmap Data

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      - name: Sync roadmap snapshot
        env:
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID || '1s4S1TS3Vkl_Xh9uZ9CSZt9VTWVhDzU5-wNpCu7q5w4g' }}
          GOOGLE_WORKSHEET_GID: ${{ vars.GOOGLE_WORKSHEET_GID || '0' }}
          ROADMAP_CSV_URL: ${{ vars.ROADMAP_CSV_URL || 'https://docs.google.com/spreadsheets/d/1s4S1TS3Vkl_Xh9uZ9CSZt9VTWVhDzU5-wNpCu7q5w4g/export?format=csv&gid=0' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/sync_roadmap_data.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- Source/roadmap-data.csv roadmap.html; then
            echo "No roadmap data changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source/roadmap-data.csv roadmap.html
          git commit -m "chore: sync roadmap data from sheet"
          git push
